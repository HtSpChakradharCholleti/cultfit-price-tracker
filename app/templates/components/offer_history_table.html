<details class="card table-card" id="offerHistoryCard">
  <summary class="card-header">
    <span>Offer History</span>
    <span class="text-muted" id="offerHistoryCount">
      {%- if offer_history %}{{ offer_history | length }} changes{% endif -%}
    </span>
  </summary>
  <div class="card-body">
    <p class="table-scroll-hint" id="offersScrollHint">Scroll horizontally to see all columns.</p>
    <div class="table-wrapper" tabindex="0" role="region" aria-label="Offer history" aria-describedby="offersScrollHint">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date/Time (IST)</th>
            <th>Change</th>
            <th>Category</th>
            <th>Offer</th>
            <th>Coupon</th>
          </tr>
        </thead>
        <tbody id="offerHistoryBody"></tbody>
      </table>
    </div>
  </div>
</details>
